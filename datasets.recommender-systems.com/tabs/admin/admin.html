<div
  class="tab-pane fade show active"
  id="admin-tab-pane"
  role="tabpanel"
  aria-labelledby="admin-tab"
  tabindex="0"
>
  <h2>Usage Logs</h2>

  <div class="mb-3 d-flex justify-content-end">
    <button id="admin-delete-all-btn" class="btn btn-danger">
      <i class="fa-solid fa-trash"></i> Delete All Logs
    </button>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover" id="admin-logs-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Seed Datasets</th>
          <th>Dataset Filter</th>
          <th>Filters</th>
          <th>Result Count</th>
          <th>Recommended Datasets</th>
        </tr>
      </thead>
      <tbody id="admin-logs-tbody">
      </tbody>
    </table>
  </div>

  <nav id="admin-pagination" style="display: none;">
    <ul class="pagination justify-content-center">
      <li class="page-item" id="admin-prev-page">
        <button class="page-link">Previous</button>
      </li>
      <li class="page-item disabled" id="admin-page-info">
        <span class="page-link" id="admin-page-text">Page 1 of 1</span>
      </li>
      <li class="page-item" id="admin-next-page">
        <button class="page-link">Next</button>
      </li>
    </ul>
  </nav>
</div>
